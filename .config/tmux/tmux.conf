# unbind C-b
# set -g prefix C-g
# bind C-g send-prefix

set -g mouse on
set -g set-clipboard on
set -g mode-keys vi
set -g main-pane-width 50%
# set -g base-index 1
# set -g pane-base-index 1

set -g @green "#98971A"

# Make pane borders more visible
# set -g pane-border-status top
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg="#{@green}"

set -ag status-style bg="#{@green}"
set -ag status-style fg="#282828"
set -g window-status-current-style bg="#151515",fg="#{@green}"

# vim-like selection and copy
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe "xclip -selection clipboard"
bind -T copy-mode-vi r send-keys -X rectangle-toggle

# to make the mouse selection not go back to the end in copy mode
# also makes it possible to use mouse to select and copy normally
unbind -T copy-mode-vi MouseDragEnd1Pane

# Reload config
bind R source-file "~/.config/tmux/tmux.conf" \; display-message "Config reloaded!"
# Kill session
bind X confirm-before -p "Kill this session? (y/n)" kill-session
# Set default directory for new windows in this session to current directory:
bind M-c attach-session -c "#{pane_current_path}"

##### no prefix #####

# Kill the currently focused pane
bind -n M-q kill-pane

# Move between panes
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
bind -n M-o last-window

# New pane/window
bind -n M-s split-window -v -c "#{session_path}" \; select-layout main-vertical
bind -n M-t new-window

# Next/previous window
bind -n M-n next-window
bind -n M-p previous-window

# Switch to window by index (Alt+0..9)
bind -n M-0 select-window -t 0
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
