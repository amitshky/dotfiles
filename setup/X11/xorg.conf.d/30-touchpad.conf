Section "InputClass"
    Identifier "ELAN Touchpad Configuration"
    MatchIsTouchpad "on"
    Driver "libinput"

    # Natural scrolling (your "scroll direction change")
    Option "NaturalScrolling" "true"

    # Tap to click
    Option "Tapping" "true"

    # Tap-and-drag behavior (usually good defaults)
    Option "TappingDrag" "true"
    Option "TappingDragLock" "true"

    # Click method (button areas vs clickfinger)
    Option "ClickMethod" "clickfinger"

    # Disable while typing (you already have this ON; keep default)
    Option "DisableWhileTyping" "true"
EndSection
